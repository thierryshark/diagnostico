<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Hanken+Grotesk:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: trilho editorial fixo à esquerda (capítulos) + coluna de leitura estreita à direita; no celular o trilho vira barra de progresso no topo. */
:root{
  --paper:#F7F7F5; --ink:#0F0F0E; --mute:#6A6A66; --line:#D8D8D3; --soft:#EDEDEA; --field:#FFFFFF;
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s1:.75rem; --s2:.875rem; --s3:1rem; --s4:1.25rem; --s5:1.75rem; --s6:2.6rem; --s7:3.6rem;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --paper:#0D0D0C; --ink:#F1F1EE; --mute:#9B9B96; --line:#2D2D2A; --soft:#191917; --field:#141413; color-scheme:dark } }
:root[data-theme="dark"]{ --paper:#0D0D0C; --ink:#F1F1EE; --mute:#9B9B96; --line:#2D2D2A; --soft:#191917; --field:#141413; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.shell{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:72px;padding-block:48px 96px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:20px 72px}}

/* Marca */
.brand{display:flex;align-items:center;gap:14px;color:var(--ink);text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:1.1}
.brand .wm b{font-family:var(--f-body);font-weight:500;letter-spacing:.42em;font-size:.82rem}
.brand .wm span{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;margin-top:6px}

/* Trilho */
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 40px);align-self:start;display:flex;flex-direction:column;gap:40px}
.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.chapters li button{all:unset;cursor:pointer;display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:baseline;width:100%;padding:11px 0;border-bottom:1px solid var(--line);color:var(--mute);font-size:.88rem;transition:color .2s}
.chapters li button:hover{color:var(--ink)}
.chapters li button:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
.chapters .n{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em}
.chapters .tick{font-family:var(--f-mono);font-size:.66rem}
.chapters li[aria-current="step"] button{color:var(--ink);font-weight:500}
.rail-note{font-size:.8rem;color:var(--mute);line-height:1.55}
.rail-note strong{color:var(--ink);font-weight:500}
@media (max-width:860px){
  .rail{position:static;gap:18px}
  .chapters{display:none}
  .rail-note{display:none}
}
.mbar{display:none}
@media (max-width:860px){
  .mbar{display:flex;flex-direction:column;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:5;padding-block:10px;margin-inline:calc(-1 * max(16px, env(safe-area-inset-left, 0px)));padding-inline:max(16px, env(safe-area-inset-left, 0px));border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
}
.mbar .row{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.track{height:1px;background:var(--line);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .4s ease}

/* Conteúdo */
main{min-width:0;max-width:660px}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);display:flex;gap:14px;align-items:center}
.eyebrow::after{content:"";height:1px;flex:1;background:var(--line);max-width:80px}
h1,h2{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(2.6rem,6vw,4.1rem);line-height:1.02}
h1 em,h2 em{font-style:italic}
h2{font-size:clamp(2.1rem,4.6vw,3rem);line-height:1.05}
.lede{font-size:1.06rem;color:var(--mute);max-width:56ch;margin:0}
.section-head{display:flex;flex-direction:column;gap:18px;margin-bottom:var(--s6)}

.intro{display:flex;flex-direction:column;gap:26px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.facts div{padding:16px 14px 16px 0;display:flex;flex-direction:column;gap:4px}
.facts div+div{padding-left:14px;border-left:1px solid var(--line)}
.facts b{font-family:var(--f-display);font-weight:500;font-size:1.7rem;line-height:1}
.facts span{font-size:.78rem;color:var(--mute)}
@media (max-width:480px){.facts{grid-template-columns:minmax(0,1fr)}.facts div+div{border-left:0;padding-left:0;border-top:1px solid var(--line)}}
.principles{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;font-size:.95rem}
.principles li{display:grid;grid-template-columns:22px 1fr;gap:10px}
.principles li::before{content:"";width:7px;height:7px;border:1px solid var(--ink);transform:rotate(45deg);margin-top:.55em;margin-left:4px}

/* Campos */
.q{display:flex;flex-direction:column;gap:10px;padding-block:26px;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:0}
.q label.t, .q .t{font-weight:500;font-size:1.02rem;line-height:1.4}
.q .h{font-size:.85rem;color:var(--mute);margin-top:-4px}
.q .req{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:8px;vertical-align:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.grid2 .q{border-top:1px solid var(--line);padding-top:26px}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea,select{
  width:100%;font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:8px 0;border-radius:0;transition:border-color .2s}
textarea{resize:vertical;min-height:96px;line-height:1.55;border:1px solid var(--line);padding:12px 14px;background:var(--field)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--mute);opacity:.7}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;border:1px solid var(--line);padding:7px 14px;font-size:.88rem;line-height:1.3;border-radius:999px;transition:all .15s}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip-other{margin-top:4px}

.scale{display:flex;flex-direction:column;gap:22px}
.sl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:center;font-size:.86rem}
.sl span:last-child{text-align:right}
.sl .dots{display:flex;justify-content:space-between;position:relative}
.sl .dots::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:1px;background:var(--line)}
.sl .dots button{all:unset;cursor:pointer;width:13px;height:13px;border-radius:50%;border:1px solid var(--mute);background:var(--paper);position:relative}
.sl .dots button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sl .dots button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);transform:scale(1.25)}
@media (max-width:520px){.sl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.sl .dots{grid-column:1 / -1;grid-row:2}.sl span:last-child{text-align:right}}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media (max-width:640px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{all:unset;cursor:pointer;background:var(--paper);padding:16px 14px;display:flex;flex-direction:column;gap:6px;position:relative;min-height:112px}
.card:hover{background:var(--soft)}
.card:focus-visible{outline:1px solid var(--ink);outline-offset:-4px}
.card b{font-family:var(--f-display);font-size:1.3rem;font-weight:500;line-height:1.1}
.card span{font-size:.8rem;color:var(--mute);line-height:1.45}
.card .rank{position:absolute;top:10px;right:12px;font-family:var(--f-mono);font-size:.6rem;letter-spacing:.1em;text-transform:uppercase}
.card[data-rank="1"]{background:var(--ink);color:var(--paper)}
.card[data-rank="1"] span{color:var(--paper);opacity:.75}
.card[data-rank="2"]{box-shadow:inset 0 0 0 1px var(--ink)}

.refs{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--ink)}
.ref{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1.4fr);gap:12px 18px;align-items:end;padding:14px 0;border-bottom:1px solid var(--line)}
.ref .n{font-family:var(--f-mono);font-size:.7rem;color:var(--mute);padding-bottom:10px}
@media (max-width:560px){.ref{grid-template-columns:28px minmax(0,1fr)}.ref input:last-child{grid-column:2}}

/* Navegação */
.nav{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:var(--s6);padding-top:22px;border-top:1px solid var(--ink);flex-wrap:wrap}
.btn{all:unset;cursor:pointer;font-family:var(--f-body);font-size:.9rem;font-weight:500;letter-spacing:.04em;padding:13px 26px;border:1px solid var(--ink);display:inline-flex;gap:10px;align-items:center;transition:all .15s}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.86}
.btn.ghost:hover{background:var(--soft)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn[hidden]{display:none!important}
.saved{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

/* Revisão / envio */
.review{display:flex;flex-direction:column;gap:22px}
.sum{border:1px solid var(--line);background:var(--field)}
.sum .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);flex-wrap:wrap}
.sum pre{margin:0;padding:16px;max-height:380px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.78rem;line-height:1.6;color:var(--ink)}
.steps-send{list-style:none;padding:0;margin:0;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps-send li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:8px;font-size:.95rem}
.steps-send li::before{content:counter(s, decimal-leading-zero);font-family:var(--f-mono);font-size:.72rem;color:var(--mute);padding-top:3px}
.toast{font-size:.85rem;color:var(--ink)}
.done-mark{font-family:var(--f-display);font-style:italic;font-size:1.25rem}

footer.sig{margin-top:var(--s7);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}

.view{animation:in .45s ease both}
@keyframes in{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}.track i{transition:none}}
</style>

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#" aria-label="Thierry, estratégia de marca">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="1" y="1" width="38" height="38" stroke="currentColor" stroke-width="1"/>

</div>

 { id:"voce", nav:"Quem responde", title:"Antes de tudo, <em>quem</em> está do outro lado.", lede:"Dados básicos para eu organizar o seu diagnóstico e voltar a falar com você.",

    {k:"ticket",t:"Faixa de preço das peças",type:"chips",opts:["Até R$ 100","R$ 100 a 250","R$ 250 a 500","R$ 500 a 1.000","Acima de R$ 1.000","Faixas bem variadas"]},

 { id:"refs", nav:"Referências", title:"As marcas que <em>você admira</em>.", lede:"Contas e marcas que você olha e pensa “é isso”. Podem ser de qualquer segmento: joias, moda, decoração, café, hotel, igreja, criador de conteúdo.",

    return `<div class="q"><div class="t">${q.t}</div><div class="h">${q.h}</div><div class="refs">${rows}</div></div>`;

  if (q.type === "arq"){
    const pick = Array.isArray(v) ? v : [];
    const cards = ARQ.map(([n,d]) => { const r = pick.indexOf(n)+1; return `<button type="button" class="card" data-arq="${n}" data-rank="${r||""}" aria-pressed="${r>0}"><span class="rank">${r===1?"Principal":r===2?"Secundária":""}</span><b>${n}</b><span>${d}</span></button>`; }).join("");

    A[k] = (A[k] && typeof A[k]==="object") ? A[k] : {};
    A[k][i] = A[k][i] === n ? undefined : n;
    b.parentElement.querySelectorAll("button").forEach(d => d.setAttribute("aria-pressed", String(+d.dataset.n === A[k][i])));
    persist(); return;
  }
  if (b.id === "send"){
    const toast = $("#toast");
    if (b.dataset.busy) return;
    b.dataset.busy = "1"; b.textContent = "Enviando…"; toast.textContent = "";
    const body = JSON.stringify({ nome: A.nome || null, respostas: A, resumo: summaryText() });
    fetch(SB_URL + "/rest/v1/diagnosticos_marca", { method:"POST", headers:{ "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" }, body })
      .then(r => { if (!r.ok) throw new Error(r.status); try{ localStorage.setItem(KEY+"-sent", String(Date.now())); }catch(e){}
        b.textContent = "Enviado ✓"; toast.textContent = "Recebi suas respostas. Obrigado! Em breve falo com você."; })
      .catch(() => { delete b.dataset.busy; b.textContent = "Tentar enviar de novo"; toast.textContent = "Não consegui enviar agora. Verifique a internet e tente de novo, ou toque em “Copiar uma cópia” e me mande pelo WhatsApp."; });
    return;
  }
  if (b.id === "copy"){
    const txt = summaryText(); const toast = $("#toast");
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("#sumText")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast.textContent = "Texto selecionado. Use o comando de copiar do seu aparelho."; };
    try { navigator.clipboard.writeText(txt).then(()=>{ toast.textContent = "Copiado. Agora é só colar e enviar."; }, fallback); } catch(err){ fallback(); }
    return;
  }
});

$("#next").addEventListener("click", () => go(step + 1));
$("#prev").addEventListener("click", () => go(step - 1));

render();
})();
</script>

</body>
</html>
